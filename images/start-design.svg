<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" width="1600" height="1067" role="img" aria-label="Ilustração de design system: paleta de cores, componentes, frame selecionado e fluxo de jornada, em tons de roxo">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d00ff"/>
      <stop offset="1" stop-color="#2b0f4f"/>
    </linearGradient>
    <pattern id="grid2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- background and grid -->
  <rect width="1600" height="1067" fill="url(#bg2)"/>
  <rect width="1600" height="1067" fill="url(#grid2)"/>

  <!-- colour tokens -->
  <text x="120" y="150" font-family="system-ui, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" opacity="0.85">Tokens de cor</text>
  <rect x="120" y="180" width="150" height="150" rx="18" fill="#2b0f4f"/>
  <rect x="290" y="180" width="150" height="150" rx="18" fill="#5b1fb0"/>
  <rect x="460" y="180" width="150" height="150" rx="18" fill="#9d00ff"/>
  <rect x="630" y="180" width="150" height="150" rx="18" fill="#c77dff"/>
  <rect x="800" y="180" width="150" height="150" rx="18" fill="#faf5f0"/>
  <rect x="970" y="180" width="150" height="150" rx="18" fill="#1b1411"/>

  <!-- components -->
  <text x="120" y="420" font-family="system-ui, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" opacity="0.85">Componentes</text>
  <rect x="120" y="450" width="260" height="70" rx="35" fill="#9d00ff"/>
  <rect x="150" y="477" width="120" height="16" rx="8" fill="#ffffff" opacity="0.95"/>
  <rect x="120" y="545" width="260" height="70" rx="16" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <rect x="146" y="570" width="90" height="12" rx="6" fill="#ffffff" opacity="0.5"/>
  <rect x="420" y="450" width="330" height="165" rx="20" fill="#faf5f0" opacity="0.95"/>
  <rect x="446" y="478" width="120" height="14" rx="7" fill="#2b0f4f"/>
  <rect x="446" y="506" width="270" height="10" rx="5" fill="#2b0f4f" opacity="0.3"/>
  <rect x="446" y="530" width="200" height="10" rx="5" fill="#2b0f4f" opacity="0.3"/>
  <rect x="446" y="560" width="100" height="36" rx="18" fill="#9d00ff"/>

  <!-- selected frame with handles -->
  <rect x="800" y="430" width="360" height="240" rx="12" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="820" y="460" width="320" height="26" rx="6" fill="#ffffff" opacity="0.5"/>
  <rect x="820" y="504" width="150" height="110" rx="10" fill="#c77dff" opacity="0.7"/>
  <rect x="990" y="504" width="150" height="110" rx="10" fill="#ffffff" opacity="0.25"/>
  <g fill="#ffffff" stroke="#9d00ff" stroke-width="3">
    <rect x="792" y="422" width="16" height="16"/>
    <rect x="1152" y="422" width="16" height="16"/>
    <rect x="792" y="662" width="16" height="16"/>
    <rect x="1152" y="662" width="16" height="16"/>
  </g>

  <!-- user journey -->
  <text x="120" y="760" font-family="system-ui, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" opacity="0.85">Jornada do usuário</text>
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8">
    <rect x="120" y="800" width="260" height="120" rx="18"/>
    <rect x="460" y="800" width="260" height="120" rx="18"/>
    <rect x="800" y="800" width="260" height="120" rx="18"/>
    <rect x="1140" y="800" width="260" height="120" rx="18"/>
  </g>
  <g font-family="system-ui, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff">
    <text x="150" y="852">Descoberta</text>
    <text x="490" y="852">Fluxo</text>
    <text x="830" y="852">Protótipo</text>
    <text x="1170" y="852">Entrega</text>
  </g>
  <g stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)">
    <line x1="385" y1="860" x2="455" y2="860"/>
    <line x1="725" y1="860" x2="795" y2="860"/>
    <line x1="1065" y1="860" x2="1135" y2="860"/>
  </g>

  <!-- decorative anchor points -->
  <g fill="#faf5f0">
    <circle cx="1480" cy="150" r="10"/>
    <circle cx="1420" cy="210" r="6"/>
    <circle cx="1500" cy="260" r="8"/>
  </g>
</svg>
